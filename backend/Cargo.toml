[package]
name = "appcheck"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib"]

[dependencies]
idevice = { git = "https://github.com/jkcoxson/idevice", rev = "7bd551c16c6dd2e058740d85a2d9399a51a776e9", default-features = false, features = ["aws-lc", "remote_pairing", "tunnel_tcp_stack", "rsd", "tcp", "installation_proxy"] }
plist = "1.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "time"] }
